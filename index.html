<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitch Clip Hotkeys — Ajustes</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <section class="panel">
        <h2>Cuenta de Twitch</h2>
        <div class="row">
          <label for="client-id">Client ID</label>
          <input id="client-id" placeholder="Pega aquí el client_id de tu app" />
          <button id="save-client-id">Guardar</button>
        </div>
        <p class="hint">
          Registra una app tipo <strong>Public</strong> (sin secret) en
          <a href="https://dev.twitch.tv/console" target="_blank" rel="noreferrer">dev.twitch.tv/console</a>.
        </p>
        <div id="status-badge"></div>
        <div class="row">
          <button id="connect-btn">Conectar con Twitch</button>
          <button id="disconnect-btn">Desconectar</button>
        </div>
        <p id="user-code-line" class="hint hidden"></p>
      </section>

      <section class="panel">
        <h2>Atajos</h2>
        <div id="hotkey-list"></div>
        <div class="row">
          <button id="add-hotkey-btn">+ Agregar atajo</button>
          <button id="save-hotkeys-btn">Guardar atajos</button>
        </div>
        <p id="hotkey-error" class="error hidden"></p>
        <p id="hotkey-startup-error" class="error hidden"></p>
      </section>

      <section class="panel">
        <h2>Diagnóstico</h2>
        <p id="diagnostic-line" class="hint">Sin actividad todavía.</p>
      </section>
    </main>
  </body>
</html>
